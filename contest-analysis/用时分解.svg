<svg xmlns="http://www.w3.org/2000/svg" width="900" height="532" viewBox="0 0 900 532"><rect width="900" height="660" fill="#ffffff"/><text x="34" y="44" font-family="Microsoft YaHei,Arial" font-size="23" fill="#1f2329" font-weight="bold">用时预算分解：时间是花在哪儿的（计划路径 5907mm，模型 14.83s）</text><text x="34" y="70" font-family="Microsoft YaHei,Arial" font-size="14" fill="#646a73">速度模型 v = min(400, 130°/s × 弯道半径)；实测完赛 15.99s ⇒ 与模型的差额 ≈1.16s</text><rect x="24" y="92" width="852" height="196" rx="10" fill="#f7f8fa" stroke="#e5e6eb"/><text x="44" y="120" font-family="Microsoft YaHei,Arial" font-size="16" fill="#1f2329" font-weight="bold">① 每段花多少时间（条长 ∝ 用时）</text><text x="238" y="152" font-family="Microsoft YaHei,Arial" font-size="13" fill="#1f2329" text-anchor="end">绕柱3弧</text><rect x="250" y="140" width="227.4" height="16" rx="3" fill="#e5533d"/><text x="485.4" y="153" font-family="Microsoft YaHei,Arial" font-size="13" fill="#646a73">6.03s（40.6%）</text><text x="238" y="176" font-family="Microsoft YaHei,Arial" font-size="13" fill="#1f2329" text-anchor="end">绕柱1弧</text><rect x="250" y="164" width="122.9" height="16" rx="3" fill="#ef8a72"/><text x="380.9" y="177" font-family="Microsoft YaHei,Arial" font-size="13" fill="#646a73">3.26s（22.0%）</text><text x="238" y="200" font-family="Microsoft YaHei,Arial" font-size="13" fill="#1f2329" text-anchor="end">切入绕3前</text><rect x="250" y="188" width="76.6" height="16" rx="3" fill="#9aa4b2"/><text x="334.6" y="201" font-family="Microsoft YaHei,Arial" font-size="13" fill="#646a73">2.03s（13.7%）</text><text x="238" y="224" font-family="Microsoft YaHei,Arial" font-size="13" fill="#1f2329" text-anchor="end">过渡·切线/门区弧</text><rect x="250" y="212" width="57.7" height="16" rx="3" fill="#9aa4b2"/><text x="315.7" y="225" font-family="Microsoft YaHei,Arial" font-size="13" fill="#646a73">1.53s（10.3%）</text><text x="238" y="248" font-family="Microsoft YaHei,Arial" font-size="13" fill="#1f2329" text-anchor="end">起步/进弯</text><rect x="250" y="236" width="46.0" height="16" rx="3" fill="#c8ced8"/><text x="304.0" y="249" font-family="Microsoft YaHei,Arial" font-size="13" fill="#646a73">1.22s（8.2%）</text><text x="238" y="272" font-family="Microsoft YaHei,Arial" font-size="13" fill="#1f2329" text-anchor="end">穿门直线</text><rect x="250" y="260" width="29.4" height="16" rx="3" fill="#c8ced8"/><text x="287.4" y="273" font-family="Microsoft YaHei,Arial" font-size="13" fill="#646a73">0.78s（5.3%）</text><text x="250" y="292" font-family="Microsoft YaHei,Arial" font-size="13.5" fill="#e5533d" font-weight="bold">↑ 绕柱两弧合计 9.29s = 62.6%，是绝对大头；其余 5.54s 里没有任何慢段</text><rect x="24" y="306" width="852" height="212" rx="10" fill="#f7f8fa" stroke="#e5e6eb"/><text x="44" y="334" font-family="Microsoft YaHei,Arial" font-size="16" fill="#1f2329" font-weight="bold">② 各段实测地速 vs 速度上限 400mm/s（条长 ∝ mm/s）</text><text x="178" y="369" font-family="Microsoft YaHei,Arial" font-size="13" fill="#1f2329" text-anchor="end">出弯+切线</text><rect x="190" y="356" width="534.8" height="17" rx="3" fill="#4b8bd6"/><text x="732.8" y="370" font-family="Microsoft YaHei,Arial" font-size="13" fill="#4b8bd6" font-weight="bold">410</text><text x="178" y="394" font-family="Microsoft YaHei,Arial" font-size="13" fill="#1f2329" text-anchor="end">门区（穿门直线）</text><rect x="190" y="381" width="519.1" height="17" rx="3" fill="#4b8bd6"/><text x="717.1" y="395" font-family="Microsoft YaHei,Arial" font-size="13" fill="#4b8bd6" font-weight="bold">398</text><text x="178" y="419" font-family="Microsoft YaHei,Arial" font-size="13" fill="#1f2329" text-anchor="end">下压弧</text><rect x="190" y="406" width="516.5" height="17" rx="3" fill="#4b8bd6"/><text x="714.5" y="420" font-family="Microsoft YaHei,Arial" font-size="13" fill="#4b8bd6" font-weight="bold">396</text><text x="178" y="444" font-family="Microsoft YaHei,Arial" font-size="13" fill="#1f2329" text-anchor="end">出弯冲刺</text><rect x="190" y="431" width="502.2" height="17" rx="3" fill="#4b8bd6"/><text x="700.2" y="445" font-family="Microsoft YaHei,Arial" font-size="13" fill="#4b8bd6" font-weight="bold">385</text><text x="178" y="469" font-family="Microsoft YaHei,Arial" font-size="13" fill="#1f2329" text-anchor="end">下降+进弯</text><rect x="190" y="456" width="456.5" height="17" rx="3" fill="#e5533d"/><text x="654.5" y="470" font-family="Microsoft YaHei,Arial" font-size="13" fill="#e5533d" font-weight="bold">350</text><text x="178" y="494" font-family="Microsoft YaHei,Arial" font-size="13" fill="#1f2329" text-anchor="end">起步</text><rect x="190" y="481" width="420.0" height="17" rx="3" fill="#e5533d"/><text x="618.0" y="495" font-family="Microsoft YaHei,Arial" font-size="13" fill="#e5533d" font-weight="bold">322</text><line x1="711.7" y1="348" x2="711.7" y2="492" stroke="#e5533d" stroke-width="1.6" stroke-dasharray="5,4"/><text x="711.7" y="340" font-family="Microsoft YaHei,Arial" font-size="12.5" fill="#e5533d" text-anchor="middle">上限 400</text><text x="190" y="514" font-family="Microsoft YaHei,Arial" font-size="13.5" fill="#e5533d" font-weight="bold">↑ 只有起步(322) 与下降+进弯(350) 低于上限——它们和绕柱段同源（大转角⇒尾角被偏置）</text><rect x="24" y="536" width="852" height="118" rx="10" fill="#fff7f5" stroke="#f6c9bd"/><text x="44" y="566" font-family="Microsoft YaHei,Arial" font-size="16" fill="#c8381f" font-weight="bold">③ 本轮唯一改动：CRUISE_TAIL_AMP  21.0 → 30.0（test.py 第 482 行）</text><text x="44" y="592" font-family="Microsoft YaHei,Arial" font-size="13.5" fill="#1f2329">依据：forward_force 45→50 实测零收益（胸鳍只是辅助）而 A 21→38 让绕柱地速 +10% ⇒ 尾鳍才是主推进、摆幅是唯一速度旋钮。</text><text x="44" y="614" font-family="Microsoft YaHei,Arial" font-size="13.5" fill="#1f2329">起步/进弯两段同样"大转角⇒尾角偏置⇒A=21 不跨零⇒不出推力"，却因不在绕柱圆上而仍用 21 ⇒ 一并抬到 30。</text><text x="44" y="636" font-family="Microsoft YaHei,Arial" font-size="13.5" fill="#646a73">验收：起步/进弯提速 · 穿门 ≤1.32s · 门区 max|y|≈0 · |lat|max ≤37mm · minD1/D3 ≥180mm；回退 = 改回 21.0 一行。</text></svg>